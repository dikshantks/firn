{{- if and .Values.hpa.enabled (not .Values.isCanary) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fern-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fern.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fern-backend
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
