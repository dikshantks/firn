apiVersion: batch/v1
kind: Job
metadata:
  name: fern-migrate{{ include "fern.canarySuffix" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fern.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fern
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.backend.serviceAccountName }}
      containers:
        - name: migrate
          image: {{ include "fern.image" (dict "registry" .Values.registry "imageName" .Values.backend.imageName "tag" .Values.backend.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "scripts/migrate.sh"]
          env:
            - name: FERN_USE_DB
              value: "true"
            {{- if not .Values.infraSettings }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.databaseUrlKey }}
            {{- end }}
          {{- if .Values.infraSettings }}
          envFrom:
            - secretRef:
                name: {{ include "fern.infraSecretName" . }}
          {{- end }}
