{{- if and .Values.pdb.enabled (not .Values.isCanary) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fern-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fern.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fern
      app.kubernetes.io/component: backend
{{- end }}
