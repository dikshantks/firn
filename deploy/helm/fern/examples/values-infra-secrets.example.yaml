# Example infra secrets file for heva merge during deploy.
# Upload the real file to S3 (see deploy/README.md). Values must be base64-encoded.

infraSettings:
  # mysql+pymysql://user:pass@fern-prod.xxxx.ap-south-1.rds.amazonaws.com:3306/fern
  DATABASE_URL: "<base64-encoded-database-url>"
  # Optional bearer token for MCP → backend auth
  FERN_MCP_TOKEN: "<base64-encoded-token>"
