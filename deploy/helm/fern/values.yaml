# Base defaults for local `helm template` / kind installs.
# Production deploys merge env files via heva + S3 infra secrets (see deploy.sh).

environment: local
namespace: fern
registry: ""
isCanary: false

global:
  imagePullPolicy: IfNotPresent

backend:
  imageName: fern-backend
  tag: latest
  replicas: 2
  serviceAccountName: fern-backend
  irsaRoleArn: ""
  env:
    FERN_USE_DB: "true"
    HOST: "0.0.0.0"
    PORT: "8000"
    RELOAD: "false"
    CORS_ORIGINS: "*"
    REPLICA_ID: "fern-backend"
    DEBUG: "false"
    METRICS_ENABLED: "true"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  imageName: fern-frontend
  tag: latest
  replicas: 2
  env:
    VITE_API_URL: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mcp:
  enabled: true
  imageName: fern-mcp
  tag: latest
  replicas: 1
  env:
    FERN_API_BASE_URL: "http://fern-backend:8000"
    MCP_HOST: "0.0.0.0"
    MCP_PORT: "8000"
    MCP_REQUEST_TIMEOUT_SECONDS: "30"
    MCP_MAX_RESPONSE_BYTES: "250000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Populated from S3 via deploy.sh → heva merge (see examples/values-infra-secrets.example.yaml)
requiredInfraDependencies:
  name: fern-infra
  values:
    DATABASE_URL: $DATABASE_URL
    FERN_MCP_TOKEN: $FERN_MCP_TOKEN

database:
  existingSecret: fern-db
  databaseUrlKey: DATABASE_URL

externalSecret:
  enabled: false
  secretStoreRefName: aws-secretsmanager
  secretStoreRefKind: ClusterSecretStore
  remoteDatabaseUrlKey: fern/prod/db

ingress:
  enabled: false
  host: fern.example.com
  className: alb
  certificateArn: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false
