global:
  imagePullPolicy: IfNotPresent

backend:
  image: fern/backend
  tag: latest
  replicas: 2
  serviceAccountName: fern-backend
  irsaRoleArn: ""
  env:
    FERN_USE_DB: "true"
    HOST: "0.0.0.0"
    PORT: "8000"
    RELOAD: "false"
    CORS_ORIGINS: "*"
    REPLICA_ID: "fern-backend"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  image: fern/frontend
  tag: latest
  replicas: 2
  env:
    VITE_API_URL: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mcp:
  enabled: true
  image: fern/mcp
  tag: latest
  replicas: 1
  env:
    FERN_API_BASE_URL: "http://fern-backend:8000"
    MCP_HOST: "0.0.0.0"
    MCP_PORT: "8000"
    MCP_REQUEST_TIMEOUT_SECONDS: "30"
    MCP_MAX_RESPONSE_BYTES: "250000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  existingSecret: fern-db
  databaseUrlKey: DATABASE_URL

externalSecret:
  enabled: false
  secretStoreRefName: aws-secretsmanager
  secretStoreRefKind: ClusterSecretStore
  remoteDatabaseUrlKey: fern/prod/db

ingress:
  enabled: false
  host: fern.example.com
  className: alb
  certificateArn: ""

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false
